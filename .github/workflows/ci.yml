name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check formatting
        run: deno fmt --check src scripts

      - name: Lint
        run: deno lint src scripts

      - name: Check types
        run: deno check --allow-import src/main.tsx

      - name: Test
        run: deno test --allow-import src/crypto_test.ts

      - name: Build
        run: deno run -A scripts/build.ts

      # GitHub Pages serves the committed files from the repository root, so a
      # stale build would silently ship old code. Rebuilding must be a no-op.
      - name: Verify the committed site matches the sources
        run: |
          if ! git diff --exit-code --stat -- app.js styles.css index.html icon.svg .nojekyll; then
            echo "::error::The committed site is out of date. Run 'deno task build' and commit the result."
            exit 1
          fi
