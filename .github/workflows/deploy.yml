name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check formatting
        run: deno fmt --check src scripts

      - name: Lint
        run: deno lint src scripts

      - name: Check types
        run: deno check --allow-import src/main.tsx

      - name: Test
        run: deno test --allow-import src/crypto_test.ts

      - name: Build
        run: deno run -A scripts/build.ts

      # Requires Settings -> Pages -> Source = GitHub Actions. The workflow
      # token cannot set that itself: creating a Pages site needs repository
      # admin, while pages: write only covers deploying to an existing one.
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
