<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--
  Every script and stylesheet is same-origin: the only third parties are the
  web fonts, which the page degrades gracefully without. connect-src 'none'
  means that once this page has loaded it cannot open a network connection of
  any kind, so nothing typed into it can leave the tab.

  frame-ancestors is absent because a meta CSP cannot carry it; GitHub Pages
  sends its own X-Frame-Options: deny.
-->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'none';
  script-src 'self';
  style-src 'self' https://fonts.googleapis.com;
  font-src https://fonts.gstatic.com;
  img-src 'self' data:;
  connect-src 'none';
  base-uri 'none';
  form-action 'none'">
<title>Secure transfer — hand something over without trusting the channel</title>
<meta name="description" content="Send and receive secrets with RSA-OAEP and AES-256-GCM, entirely in your browser. Nothing is uploaded.">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@400;500&family=Spectral:wght@600&display=swap">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div id="app">
  <noscript>
    <p class="noscript">
      This page encrypts in your browser, so it needs JavaScript. Nothing is sent anywhere either
      way — turn JavaScript on for this page and it will work.
    </p>
  </noscript>
</div>
<script type="module" src="./app.js"></script>
</body>
</html>
